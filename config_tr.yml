# Türkçe PL-BERT — çok dilli PL-BERT (papercup-ai) ile aynı yapı; egit.py yol ve ayırıcıyı doldurur.
log_dir: "Checkpoint_tr"
mixed_precision: "fp16"
data_folder: "tr"
batch_size: 64
save_interval: 10000
log_interval: 100
num_process: 1
num_steps: 100000

dataset_params:
    tokenizer: "dbmdz/bert-base-turkish-cased"
    token_separator: " "
    token_mask: "M"
    word_separator: 3          # [SEP]; egit.py parçalayıcıdan yeniden okur
    token_maps: "token_maps.pkl"
    max_mel_length: 512
    word_mask_prob: 0.15
    phoneme_mask_prob: 0.1
    replace_prob: 0.2

model_params:
    vocab_size: 178
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    dropout: 0.1

name: kontrol
on: [push, pull_request]
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # eğitim GPU ister; burada yalnız betiklerin derlendiği ve yapılandırmanın okunduğu sınanır
      - run: python -m py_compile egit.py veri.py hf/yukle.py
      - run: bash -n plbert.sh
      - run: pip install pyyaml && python -c "import yaml; yaml.safe_load(open('config_tr.yml'))"
